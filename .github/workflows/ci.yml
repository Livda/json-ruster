name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.86.4
        with:
          tool: cargo-llvm-cov
      - name: Coverage summary
        run: |
          {
            echo "## Coverage (cargo test --lib)"
            echo '```'
            cargo llvm-cov --lib --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: cargo llvm-cov --lib --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          pct=$(cargo llvm-cov --lib --summary-only | grep '^TOTAL' | grep -oE '[0-9]+\.[0-9]+%' | sed -n 3p | tr -d '%')
          color=$(awk -v p="$pct" 'BEGIN { if (p>=90) print "brightgreen"; else if (p>=75) print "green"; else if (p>=50) print "yellow"; else print "red" }')
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > .github/badges/coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git push

  build-wasm:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo install trunk --locked
      - run: trunk build --release
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: json-ruster:${{ github.sha }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [build-wasm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo install trunk --locked
      # GitHub Pages serves a project site under /<repo>/, not the domain
      # root -- override the public URL only for this build so local dev
      # and the Docker image (served at whatever root the user maps it to)
      # are unaffected.
      - run: trunk build --release --public-url /json-ruster/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
