[package]
name = "json-ruster"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "SvgElement",
    "DomRect",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "Element",
    "Document",
    "Window",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
] }
serde_yaml = "0.9.34"
roxmltree = "0.21.1"
csv = "1.4.0"
toml = "1.1.4"
js-sys = "0.3.104"

[profile.release]
opt-level = "s"
